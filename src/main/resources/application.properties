# Tiered telemetry storage configuration
telemetry.storage.data-dir=data
telemetry.storage.hot-max-age=1h
telemetry.storage.cool-after-idle=30m
telemetry.storage.raw-retention=7d
telemetry.storage.downsampled-retention=30d
telemetry.storage.migration-batch-size=500
telemetry.storage.scan-interval=5s
telemetry.storage.compression=gzip
telemetry.storage.query-timeout=30s
telemetry.storage.max-hot-samples=100000
