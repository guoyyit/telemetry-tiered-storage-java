# Tiered telemetry storage configuration
telemetry.data-dir=./data
telemetry.hot-max-age=1h
telemetry.access-window=10m
telemetry.promote-heat-threshold=3
telemetry.migration-batch-size=500
telemetry.scan-interval=5s
telemetry.compression=GZIP
telemetry.raw-retention=1d
telemetry.downsampled-retention=7d
telemetry.downsample-resolution=1m
telemetry.max-hot-samples=100000
telemetry.max-result-samples=100000
telemetry.default-query-timeout-ms=30000
telemetry.scheduling-enabled=true
